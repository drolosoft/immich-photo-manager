name: Docker

# Publishes ghcr.io/drolosoft/immich-photo-manager on every release tag,
# multi-arch (amd64 + arm64), tagged with the version and `latest`.

on:
  push:
    tags: ["v*"]

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Annotations go on the manifest and on the index: the ghcr package page
      # reads the description of a multi-arch image from the index, and labels
      # alone only reach the per-platform configs.
      - id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

      # The image must actually serve before the tag is public: run the
      # just-built amd64 image and hit /health.
      - name: Smoke — /health answers from the published image
        run: |
          docker run -d --name smoke -p 8626:8626 ghcr.io/${{ github.repository }}:latest
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8626/health; then echo; exit 0; fi
            sleep 2
          done
          echo "health never answered"; docker logs smoke; exit 1
